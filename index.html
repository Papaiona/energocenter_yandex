<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Энергоцентр · Project Finance (поэтапный пуск)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.12.0/dist/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #0a1929;
      --text-secondary: #2a3a4e;
      --accent: #00bfa6;
      --accent-dark: #009f8c;
      --accent-light: #ccf5f0;
      --border: #d0dbe4;
      --input-bg: #f8fafc;
      --shadow-sm: 0 1px 3px rgba(10, 44, 78, 0.08);
      --shadow-md: 0 4px 12px rgba(10, 44, 78, 0.1);
      --shadow-lg: 0 10px 25px rgba(10, 44, 78, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --primary-btn: linear-gradient(135deg, #0a2c4e 0%, #143c64 100%);
      --primary-btn-text: white;
      --success-gradient: linear-gradient(135deg, #00bfa6 0%, #009f8c 100%);
      --error: #e74c3c;
    }

    .dark-theme {
      --bg: #0a1929;
      --card-bg: #112b42;
      --text: #e0eaf5;
      --text-secondary: #9aaec9;
      --accent: #00bfa6;
      --accent-light: #1a3b3a;
      --border: #2a4365;
      --input-bg: #14334d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }

    .calculator-card {
      max-width: 1600px;
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 32px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 8px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: var(--input-bg);
      padding: 4px;
      border-radius: var(--radius-md);
      width: fit-content;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 20px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .tab-btn.active {
      background: white;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .dark-theme .tab-btn.active {
      background: #112b42;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 24px;
    }

    @media (max-width:1024px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .input-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-section {
      background: #f9fafb;
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      transition: background 0.2s;
    }

    .dark-theme .panel-section {
      background: #1e293b;
    }

    .section-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .collapsible .section-content {
      display: block;
    }

    .collapsible.collapsed .section-content {
      display: none;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .param-label {
      width: 200px;
      min-width: 200px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    input[type="number"],
    input[type="text"],
    select {
      flex: 1 1 auto;
      min-width: 120px;
      max-width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
    }

    .dark-theme input,
    .dark-theme select {
      background: #1e293b;
    }

    .slider-block {
      margin-bottom: 16px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .slider-value {
      background: var(--accent);
      color: white;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 10px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid white;
      cursor: pointer;
    }

    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary-btn);
      color: var(--primary-btn-text);
    }

    .btn-success {
      background: var(--success-gradient);
      color: white;
    }

    .btn-secondary {
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    canvas {
      max-height: 220px;
      min-height: 180px;
      width: 100% !important;
    }

    .chart-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .dark-theme .chart-card {
      background: #2d3748;
    }

    .chart-title {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .chart-description {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 8px;
      font-style: italic;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric-card {
      background: var(--input-bg);
      border-radius: var(--radius-md);
      padding: 12px;
      border: 1px solid var(--border);
    }

    .debt-schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    .debt-schedule-table th,
    .debt-schedule-table td {
      border: 1px solid var(--border);
      padding: 6px;
      text-align: center;
    }

    .error-message {
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: none;
    }

    .stage-row,
    .capex-year-row,
    .lifecycle-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .sensitivity-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.8rem;
    }

    .sensitivity-table th,
    .sensitivity-table td {
      border: 1px solid var(--border);
      padding: 6px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="methodologyModal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <div
      style="background: var(--card-bg); max-width: 90%; max-height: 90%; width: 800px; border-radius: var(--radius-lg); overflow: auto; padding: 20px; position: relative;">
      <button id="closeMethodologyBtn"
        style="position: sticky; top: 0; float: right; background: #e74c3c; color: white; border: none; border-radius: 20px; padding: 5px 12px; cursor: pointer;">✕
        Закрыть</button>
      <div id="methodologyContent"
        style="white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; line-height: 1.4; margin-top: 20px;">
      </div>
    </div>
  </div>

  <div class="calculator-card" id="mainCard">
    <div class="header">
      <h1><i class="fas fa-bolt" style="color:var(--accent);"></i> Энергоцентр · Project Finance <span
          style="font-size:0.8rem;">(поэтапный пуск)</span></h1>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn-primary" id="downloadMethodologyBtn"><i class="fas fa-calculator"></i> Методика</button>
        <button class="btn btn-success" id="generateReportBtn"><i class="fas fa-file-alt"></i> Отчёт</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="main">Основное</button>
      <button class="tab-btn" data-tab="scenarios">Сценарии</button>
      <button class="tab-btn" data-tab="sensitivity">Чувствительность</button>
      <button class="tab-btn" data-tab="montecarlo">Монте-Карло</button>
    </div>
    <div id="globalError" class="error-message"></div>
    <div class="tab-content active" id="main">
      <div class="grid-container">
        <div class="input-panel" id="inputPanel"></div>
        <div class="charts-panel" id="chartsPanel"></div>
      </div>
    </div>
    <div class="tab-content" id="scenarios">
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <select id="scenarioSelect"></select>
        <button class="btn btn-primary" id="saveScenarioBtn">💾 Сохранить</button>
        <button class="btn btn-secondary" id="loadScenarioBtn">📂 Загрузить</button>
        <button class="btn btn-secondary" id="deleteScenarioBtn">🗑️ Удалить</button>
      </div>
    </div>
    <div class="tab-content" id="sensitivity">
      <div>
        <h4>Анализ чувствительности</h4>
        <div id="sensitivityParams" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        <div style="margin-top:8px;">
          <label>Целевой: <select id="sensitivityTarget">
              <option value="project_npv">NPV проекта</option>
              <option value="equity_npv">NPV Equity</option>
              <option value="project_irr">IRR проекта</option>
              <option value="equity_irr">IRR Equity</option>
            </select></label>
          <label>Размах: <select id="sensitivityRange">
              <option value="20">±20%</option>
              <option value="10">±10%</option>
            </select></label>
          <button class="btn btn-primary" id="runSensitivity">Рассчитать</button>
        </div>
        <div class="chart-card"><canvas id="tornadoChart"></canvas>
          <div class="chart-description" id="tornadoDesc"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Таблица чувствительности</div>
          <div id="sensitivityTableContainer"></div>
        </div>
      </div>
    </div>
    <div class="tab-content" id="montecarlo">
      <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        <label>Итераций: <input type="number" id="mcIterations" value="500"></label>
        <label>Отклонение ±%: <input type="number" id="mcStdDev" value="15"></label>
        <button class="btn btn-primary" id="runMonteCarlo">🎲 Запустить</button>
        <span id="mcProgress"></span>
      </div>
      <div class="chart-card"><canvas id="mcHistogram"></canvas>
        <div class="chart-description">Распределение NPV проекта при случайном изменении ключевых параметров.</div>
      </div>
      <div id="mcStats" style="margin-top:12px; padding:12px; background:var(--input-bg); border-radius:8px;"></div>
    </div>
  </div>

  <script>
    const API_CALCULATE = 'https://functions.yandexcloud.net/d4emnghk3b743j5v1mhu';
    const API_BATCH = 'https://functions.yandexcloud.net/d4ehs1f924damhjs8vjv';
    // ---------- КЛИЕНТСКИЕ КОНСТАНТЫ (только для отображения) ----------
    const CLIENT_CONFIG = {
      transferTariff04: 0.329,
      transferTariff10: 0.265
    };

    const fmt = v => isNaN(v) || v === Infinity || v === -Infinity ? '—' : new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(v);
    const fmtPercent = v => (v * 100).toFixed(1) + '%';

    let currentModel = null;
    const charts = {};

    function destroyAllCharts() {
      Object.values(charts).forEach(c => c?.destroy());
      for (let k in charts) delete charts[k];
    }

    function updateCharts(model) {
      if (!model) return;
      destroyAllCharts();
      const m = model.metrics;
      const container = document.getElementById('chartsPanel');
      container.innerHTML = `
      <div class="chart-card"><div class="chart-title">Выручка / OPEX (1-й год, без НДС)</div><canvas id="barChart"></canvas><div class="chart-description">Сравнение выручки от продажи электроэнергии, тепла и общих операционных затрат за первый год проекта.</div></div>
      <div class="chart-card"><div class="chart-title">Состав OPEX (без НДС)</div><canvas id="pieChart"></canvas><div class="chart-description">Структура операционных расходов: топливо, ТО, ФОТ, экология, прочие, масло, утилизация, расходники.</div></div>
      <div class="chart-card"><div class="chart-title">Себестоимость vs тариф (без НДС)</div><canvas id="costPerKwhChart"></canvas><div class="chart-description">Средневзвешенная себестоимость 1 кВт·ч (суммарный OPEX / суммарный полезный отпуск) и тариф покупки из сети (с передачей).</div></div>
      <div class="chart-card"><div class="chart-title">FCFF и FCFE</div><canvas id="cfChart"></canvas><div class="chart-description">Свободный денежный поток фирмы (FCFF) и акционерам (FCFE) по годам.</div></div>
      <div class="chart-card"><div class="chart-title">Кумулятивные потоки</div><canvas id="cumCfChart"></canvas><div class="chart-description">Накопленный FCFF и FCFE нарастающим итогом.</div></div>
      <div class="chart-card"><div class="chart-title">Ключевые метрики</div><div id="metricsPanel"></div></div>
      <div class="chart-card" id="dscrCard"><div class="chart-title">DSCR (годовой)</div><canvas id="dscrChart"></canvas><div class="chart-description">Коэффициент покрытия долга (DSCR) = CFADS / (проценты + основной долг).</div></div>
     <div class="chart-card"><div class="chart-title">График долга и CFADS для банка</div>
        <table id="debtScheduleTable" class="debt-schedule-table"><tr><td colspan="5">Кредит не используется</td></tr></table>
        <div style="margin-top:10px;"><strong>CFADS (для обслуживания долга):</strong></div>
        <div id="cfadsBankTable" style="overflow-x:auto;"></div>
        <div class="chart-description">Денежный поток, доступный для обслуживания долга, и график погашения кредита.</div>
      </div>
    `;
      const y0 = model.yearly_operating[0];
      if (y0) {
        new Chart(document.getElementById('barChart'), { type: 'bar', data: { labels: ['Выручка сеть', 'Выручка тепло', 'OPEX'], datasets: [{ data: [y0.revenueGrid_excl_vat, y0.revenueHeat_excl_vat, y0.opex_excl_vat], backgroundColor: ['#94a3b8', '#f59e0b', '#00bfa6'] }] } });
        new Chart(document.getElementById('pieChart'), { type: 'doughnut', data: { labels: ['Топливо', 'ТО', 'ФОТ', 'Экология', 'Прочие', 'Масло', 'Утилизация', 'Расходники'], datasets: [{ data: [y0.fuelCost, y0.maintCost, y0.fotCost, y0.ecoCost, y0.otherOpex, y0.totalOilCost, y0.wasteCost, y0.consumablesCost], backgroundColor: ['#00bfa6', '#94a3b8', '#1e293b', '#f59e0b', '#8b5cf6', '#ec4899', '#f97316', '#14b8a6'] }] } });
      }
      const totalOpex = model.yearly_operating.reduce((s, y) => s + y.opex_excl_vat, 0);
      const totalNetKwh = model.yearly_operating.reduce((s, y) => s + y.netKWh, 0);
      const ownCost = totalNetKwh > 0 ? totalOpex / totalNetKwh : 0;
      const gridTariff = model.params.gridPriceRubKWh + (model.params.voltageKV === 0.4 ? CLIENT_CONFIG.transferTariff04 : CLIENT_CONFIG.transferTariff10);
      new Chart(document.getElementById('costPerKwhChart'), { type: 'bar', data: { labels: ['Своя (руб/кВт·ч)', 'Сеть (руб/кВт·ч)'], datasets: [{ data: [ownCost, gridTariff], backgroundColor: ['#00bfa6', '#94a3b8'] }] } });

      const yearsLabels = model.yearly_operating.map(y => y.year);
      new Chart(document.getElementById('cfChart'), { type: 'line', data: { labels: yearsLabels, datasets: [{ label: 'FCFF (проект)', data: model.fcff, borderColor: '#00bfa6' }, { label: 'FCFE (акционерам)', data: model.equity_cf, borderColor: '#1e293b' }] } });
      let cumFcff = 0, cumFcfe = 0, cumFcffArr = [], cumFcfeArr = [];
      model.fcff.forEach(v => { cumFcff += v; cumFcffArr.push(cumFcff); });
      model.equity_cf.forEach(v => { cumFcfe += v; cumFcfeArr.push(cumFcfe); });
      new Chart(document.getElementById('cumCfChart'), { type: 'line', data: { labels: yearsLabels, datasets: [{ label: 'Кум. FCFF', data: cumFcffArr, borderColor: '#00bfa6' }, { label: 'Кум. FCFE', data: cumFcfeArr, borderColor: '#1e293b' }] } });
      const metricsPanel = document.getElementById('metricsPanel');
      if (metricsPanel) {
        try {
          if (!m) throw new Error('metrics отсутствуют');

          const safeFixed = (val, digits) => (val != null && !isNaN(val)) ? val.toFixed(digits) : '—';
          const safePercent = (val, digits = 1) => (val != null && !isNaN(val)) ? (val * 100).toFixed(digits) + '%' : '—';

          metricsPanel.innerHTML = `<div class="metrics-grid">
      <div class="metric-card"><b>NPV проекта</b><br>${fmt(m.project_npv)}</div>
      <div class="metric-card"><b>IRR проекта</b><br>${safePercent(m.project_irr)}</div>
      <div class="metric-card"><b>NPV Equity</b><br>${fmt(m.equity_npv)}</div>
      <div class="metric-card"><b>IRR Equity</b><br>${safePercent(m.equity_irr)}</div>
      <div class="metric-card"><b>Min DSCR</b><br>${m.min_dscr === Infinity ? '—' : safeFixed(m.min_dscr, 2)}</div>
      <div class="metric-card"><b>LLCR</b><br>${safeFixed(m.llcr, 2)}</div>
      <div class="metric-card"><b>ROE</b><br>${safeFixed(m.roe, 1)}%</div>
      <div class="metric-card"><b>WACC</b><br>${safePercent(m.wacc)}</div>
      <div class="metric-card"><b>Ke (CAPM)</b><br>${safePercent(m.ke)}</div>
    </div>`;
        } catch (e) {
          console.error('Ошибка отображения метрик:', e);
          metricsPanel.innerHTML = '<p style="color:red;">Не удалось отобразить метрики. Проверьте консоль.</p>';
        }
      } else {
        console.error('Элемент metricsPanel не найден в DOM');
      }
      const dscrCard = document.getElementById('dscrCard');
      if (model.debtSchedule.length && m.dscr_values.length) {
        dscrCard.style.display = 'block';
        new Chart(document.getElementById('dscrChart'), { type: 'line', data: { labels: model.debtSchedule.map(d => d.year), datasets: [{ label: 'DSCR', data: m.dscr_values, borderColor: '#f59e0b' }] } });
      } else dscrCard.style.display = 'none';
      const debtTbl = document.getElementById('debtScheduleTable');
      if (model.debtSchedule.length) debtTbl.innerHTML = `<table><th>Год</th><th>Остаток</th><th>%</th><th>Тело</th><th>Платёж</th></tr>` + model.debtSchedule.map(s => `<tr><td>${s.year}</td><td>${fmt(s.debt)}</td><td>${fmt(s.interest)}</td><td>${fmt(s.principal)}</td><td>${fmt(s.payment)}</td></tr>`).join('');
      else debtTbl.innerHTML = '<tr><td colspan="5">Кредит не используется</td></tr>';
      const cfadsDiv = document.getElementById('cfadsBankTable');
      let cum = 0, html = '<table class="debt-schedule-table"><tr><th>Год</th><th>CFADS</th><th>Кум.</th></tr>';
      model.cfads.forEach((v, i) => { cum += v; html += `<tr><td>${i + 1}</td><td>${fmt(v)}</td><td>${fmt(cum)}</td></tr>`; });
      html += '</table>'; cfadsDiv.innerHTML = html;
    }

    function getParams() {
      const num = (id, def = 0) => { const el = document.getElementById(id); return el ? parseFloat(el.value) || def : def; };
      const int = (id, def = 0) => { const el = document.getElementById(id); return el ? parseInt(el.value) || def : def; };
      const chk = (id) => { const el = document.getElementById(id); return el ? el.checked : false; };
      let p = {
        projectYears: Math.max(5, int('projectYears', 10)), powerMW: parseFloat(document.getElementById('powerSlider')?.value || 6),
        voltageKV: parseFloat(document.querySelector('input[name="voltageClass"]:checked')?.value || 0.4),
        fuelCostRubM3: num('fuelCost', 8.5), gridPriceRubKWh: num('gridPrice', 7.55),

        stagedCommissioning: { active: chk('stagedCheck'), preProjectCapex: num('preProjectCapex', 0), stages: [] }
      };
      if (p.stagedCommissioning.active) {
        document.querySelectorAll('.stage-row').forEach(row => {
          const year = parseInt(row.querySelector('.stage-year').value);
          const power = parseFloat(row.querySelector('.stage-power').value);
          if (!isNaN(year) && !isNaN(power) && power > 0) p.stagedCommissioning.stages.push({ year, powerMW: power });
        });
      } else {
        p.capexProfile = [];
        document.querySelectorAll('.capex-year-row').forEach(row => {
          const y = parseInt(row.querySelector('.capex-year').value);
          const pc = parseFloat(row.querySelector('.capex-percent').value);
          if (!isNaN(y) && !isNaN(pc)) p.capexProfile.push({ yearOffset: y, percent: pc });
        });
        if (p.capexProfile.length === 0) p.capexProfile.push({ yearOffset: 0, percent: 100 });
        p.lifecycle = { active: chk('lifecycleCheck'), events: [] };
        if (p.lifecycle.active) {
          document.querySelectorAll('.lifecycle-row').forEach(row => {
            const y = parseInt(row.querySelector('.lifecycle-year').value);
            const ap = parseFloat(row.querySelector('.lifecycle-asset').value);
            const cp = parseFloat(row.querySelector('.lifecycle-cost').value);
            if (!isNaN(y) && !isNaN(ap) && !isNaN(cp)) p.lifecycle.events.push({ year: y, assetCapexPercent: ap, replacementCostPercent: cp });
          });
        }
      }
      return p;
    }

    async function refresh() {
      showError('');
      const params = getParams();
      try {
        const response = await fetch(API_CALCULATE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(params)
        });
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Server error');
        }
        const modelData = await response.json();
        // Добавляем params в модель для корректной работы графиков (тариф сети)
        modelData.params = params;
        currentModel = modelData;
        updateCharts(currentModel);
      } catch (err) {
        showError(err.message);
        console.error(err);
      }
    }

    function showError(msg) {
      const e = document.getElementById('globalError');
      e.textContent = msg ? '⚠️ ' + msg : '';

    // Сценарии (localStorage)

    function setFormParams(p) {

      ['peak', 'mid', 'night'].forEach((z, i) => { setVal(z + 'TimeShare', p.multimode.timeShares[i]); setVal(z + 'LoadFactor', p.multimode.loadFactors[i]); setVal(z + 'Tariff', p.multimode.tariffs[i]); });
      setChk('useTaxCheckbox', p.taxes.useProfitTax); setVal('profitTaxRate', p.taxes.profitTaxRate);
      setChk('usePropertyTax', p.taxes.usePropertyTax); setVal('propertyTaxRate', p.taxes.propertyTaxRate);
      setChk('cadastralCheck', p.taxes.useCadastral); setVal('cadastralVal', p.taxes.cadastralBuildingsValue); setVal('cadastralRate', p.taxes.cadastralRate);
      setChk('useVAT', p.taxes.useVAT); setVal('vatRate', p.taxes.vatRate); setChk('vatOnCapexCheck', p.taxes.vatOnCapex);
      setVal('depreciationYears', p.taxes.depreciationYears);
      setChk('useTaxHolidays', p.taxes.taxHoliday); setVal('taxHolidayYears', p.taxes.taxHolidayYears);
      setChk('useDebtCheckbox', p.debt.active); setVal('debtShare', p.debt.share); setVal('interestRate', p.debt.interestRate); setVal('loanYears', p.debt.term); setVal('graceYears', p.debt.graceYears);
      if (document.getElementById('paymentType')) document.getElementById('paymentType').value = p.debt.paymentType;
      setVal('llcrDiscountRate', p.debt.llcrDiscountRate);

      setVal('oilChangeInterval', p.oil.changeInterval); setVal('oilChangeCost', p.oil.changeCost); setVal('oilTopUpCost', p.oil.topUpCost);
      setChk('wasteCheck', p.waste.active); if (document.getElementById('wasteType')) document.getElementById('wasteType').value = p.waste.type;
      setVal('wasteFixedCost', p.waste.fixedCost); setVal('wasteRatePerHour', p.waste.ratePerHour);

      setChk('stagedCheck', p.stagedCommissioning?.active || false);
      setVal('preProjectCapex', p.stagedCommissioning?.preProjectCapex || 0);
      const stagesContainer = document.getElementById('stagesContainer');
      if (stagesContainer) stagesContainer.innerHTML = '';
      if (p.stagedCommissioning?.active && p.stagedCommissioning.stages) {
        p.stagedCommissioning.stages.forEach(s => addStageRow(s.year, s.powerMW));
      }
      const capexContainer = document.getElementById('capexProfileContainer');
      if (capexContainer && !p.stagedCommissioning?.active) {
        capexContainer.innerHTML = '';
        if (p.capexProfile && p.capexProfile.length) p.capexProfile.forEach(prof => addCapexRow(prof.yearOffset, prof.percent));
        else addCapexRow(0, 100);
      }
      const lcContainer = document.getElementById('lifecycleContainer');
      if (lcContainer && p.lifecycle?.active && p.lifecycle.events) {
        lcContainer.innerHTML = '';
        p.lifecycle.events.forEach(ev => addLifecycleRow(ev.year, ev.assetCapexPercent, ev.replacementCostPercent));
      }
      for (let k of ['gas', 'grid', 'fot', 'maint', 'heat', 'eco', 'general']) setVal('infl' + k.charAt(0).toUpperCase() + k.slice(1), p.inflation[k]);
      setVal('ecologyBase', p.ecologyBase); setVal('ecologyFactor', p.ecologyFactor);
      setChk('useWC', p.workingCapital.active); setVal('wcPercent', p.workingCapital.percent);
      setVal('riskFreeRate', p.wacc.riskFree); setVal('beta', p.wacc.beta); setVal('equityRiskPremium', p.wacc.equityRisk);
      setChk('availCheck', p.availability.active); setVal('availRate', p.availability.rate);
      setChk('efficiencyCorrectionCheck', p.efficiencyCorrection.active); setVal('efficiencyCorrectionPercent', p.efficiencyCorrection.percent);
      const stagedCheck = document.getElementById('stagedCheck');
      const traditionalSection = document.getElementById('traditionalCapexSection');
      if (stagedCheck && traditionalSection) {
        if (stagedCheck.checked) traditionalSection.style.display = 'none'; else traditionalSection.style.display = 'block';
      }
      refresh();
    }

    // Анализ чувствительности (локальный, так как он многократно вызывает модель)
    const sensParamsMap = {
      'fuelCostRubM3': 'Цена газа', 'gridPriceRubKWh': 'Тариф сети',
      'capex_total': 'Удельный CAPEX', 'powerMW': 'Мощность',
      'operatingHours': 'Часы работы', 'gasConsumption': 'Уд. расход газа', 'degradationPerYear': 'Деградация'
    };
    const sensKeys = Object.keys(sensParamsMap);
    document.getElementById('sensitivityParams').innerHTML = sensKeys.map(k => `<label><input type="checkbox" value="${k}" checked> ${sensParamsMap[k]}</label>`).join('');

    document.getElementById('runSensitivity').addEventListener('click', async () => {
      const baseParams = getParams();
      const range = parseFloat(document.getElementById('sensitivityRange').value) / 100;
      const target = document.getElementById('sensitivityTarget').value;
      const checks = [...document.querySelectorAll('#sensitivityParams input[type=checkbox]:checked')].map(cb => cb.value);
      if (!checks.length) return;

      // получаем базовую модель (одиночный запрос)
      const baseResponse = await fetch(API_CALCULATE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(baseParams)
      });
      const baseModel = await baseResponse.json();
      const getMetric = (m) => {
        if (target === 'project_npv') return m.metrics.project_npv;
        if (target === 'equity_npv') return m.metrics.equity_npv;
        if (target === 'project_irr') return m.metrics.project_irr || 0;
        return m.metrics.equity_irr || 0;
      };
      const baseVal = getMetric(baseModel);

      // формируем массив сценариев
      const scenarios = [];
      const paramInfo = [];
      for (let param of checks) {
        let baseValue;
        if (param === 'capex_total') {
          baseValue = (baseParams.capexEquipment + baseParams.capexDesign + baseParams.capexNetwork + baseParams.capexCommissioning + baseParams.capexInfrastructure);
          if (baseParams.voltageKV === 0.4) baseValue += 6;
        } else {
          baseValue = baseParams[param];
        }
        const lowVal = baseValue * (1 - range);
        const highVal = baseValue * (1 + range);

        const lowParams = JSON.parse(JSON.stringify(baseParams));
        const highParams = JSON.parse(JSON.stringify(baseParams));

        if (param === 'capex_total') {
          const factorLow = lowVal / baseValue;
          const factorHigh = highVal / baseValue;
          lowParams.capexEquipment *= factorLow;
          lowParams.capexDesign *= factorLow;
          lowParams.capexNetwork *= factorLow;
          lowParams.capexCommissioning *= factorLow;
          lowParams.capexInfrastructure *= factorLow;
          highParams.capexEquipment *= factorHigh;
          highParams.capexDesign *= factorHigh;
          highParams.capexNetwork *= factorHigh;
          highParams.capexCommissioning *= factorHigh;
          highParams.capexInfrastructure *= factorHigh;
        } else {
          lowParams[param] = lowVal;
          highParams[param] = highVal;
        }

        scenarios.push(lowParams);
        paramInfo.push({ param, type: 'low', baseValue, lowVal, highVal });
        scenarios.push(highParams);
        paramInfo.push({ param, type: 'high', baseValue, lowVal, highVal });
      }

      // один batch-запрос
      const batchResponse = await fetch(API_BATCH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenarios })
      });
      const { results } = await batchResponse.json();

      // группируем результаты
      const combined = [];
      for (let i = 0; i < results.length; i++) {
        const metric = getMetric(results[i]);
        combined.push({
          param: paramInfo[i].param,
          type: paramInfo[i].type,
          base: paramInfo[i].baseValue,
          lowVal: paramInfo[i].lowVal,
          highVal: paramInfo[i].highVal,
          metric
        });
      }

      const paramResults = checks.map(param => {
        const low = combined.find(r => r.param === param && r.type === 'low');
        const high = combined.find(r => r.param === param && r.type === 'high');
        return {
          param: sensParamsMap[param],
          base: low.base,
          lowVal: low.lowVal,
          highVal: low.highVal,
          lowMetric: low.metric,
          highMetric: high.metric,
          spread: Math.abs(high.metric - low.metric)
        };
      });

      paramResults.sort((a, b) => b.spread - a.spread);

      // отрисовка торнадо-диаграммы
      if (charts.tornado) charts.tornado.destroy();
      charts.tornado = new Chart(document.getElementById('tornadoChart'), {
        type: 'bar',
        data: {
          labels: paramResults.map(r => r.param),
          datasets: [
            { label: 'Низкое значение', data: paramResults.map(r => r.lowMetric), backgroundColor: '#f87171' },
            { label: 'Высокое значение', data: paramResults.map(r => r.highMetric), backgroundColor: '#00bfa6' }
          ]
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: true }
      });
      document.getElementById('tornadoDesc').innerHTML = `Влияние изменения параметров на ${target === 'project_npv' ? 'NPV проекта' : target === 'equity_npv' ? 'NPV Equity' : target === 'project_irr' ? 'IRR проекта' : 'IRR Equity'}. Диапазон ±${document.getElementById('sensitivityRange').value}%.`;
      const tableHtml = `<table class="sensitivity-table">
    <thead><tr><th>Параметр</th><th>Базовое значение</th><th>Низкое (-${range * 100}%)</th><th>Высокое (+${range * 100}%)</th><th>Результат при низком</th><th>Результат при высоком</th><th>Размах</th></tr></thead>
    <tbody>${paramResults.map(r => `<tr>
      <td>${r.param}</td>
      <td>${r.base.toFixed(2)}</td>
      <td>${r.lowVal.toFixed(2)}</td>
      <td>${r.highVal.toFixed(2)}</td>
      <td>${target.includes('npv') ? fmt(r.lowMetric) : (r.lowMetric * 100).toFixed(1) + '%'}</td>
      <td>${target.includes('npv') ? fmt(r.highMetric) : (r.highMetric * 100).toFixed(1) + '%'}</td>
      <td>${target.includes('npv') ? fmt(r.highMetric - r.lowMetric) : ((r.highMetric - r.lowMetric) * 100).toFixed(1) + '%'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
      document.getElementById('sensitivityTableContainer').innerHTML = tableHtml;
    });
    // Монте-Карло (локальный, так как много вызовов)
    document.getElementById('runMonteCarlo').addEventListener('click', async () => {
      const baseParams = getParams();
      const iters = parseInt(document.getElementById('mcIterations').value) || 500;
      const stdDev = parseFloat(document.getElementById('mcStdDev').value) / 100;
      const progressSpan = document.getElementById('mcProgress');
      const CHUNK_SIZE = 100;
      const npvs = [];

      for (let chunkStart = 0; chunkStart < iters; chunkStart += CHUNK_SIZE) {
        const chunkEnd = Math.min(chunkStart + CHUNK_SIZE, iters);
        const scenarios = [];

        for (let i = chunkStart; i < chunkEnd; i++) {
          const p = JSON.parse(JSON.stringify(baseParams));
          const vary = (base) => base * (1 + (Math.random() * 2 - 1) * stdDev);
          p.fuelCostRubM3 = vary(p.fuelCostRubM3);
          p.gridPriceRubKWh = vary(p.gridPriceRubKWh);
          const capexSum = (p.capexEquipment + p.capexDesign + p.capexNetwork + p.capexCommissioning + p.capexInfrastructure);
          const factor = vary(1);
          p.capexEquipment *= factor;
          p.capexDesign *= factor;
          p.capexNetwork *= factor;
          p.capexCommissioning *= factor;
          p.capexInfrastructure *= factor;
          p.operatingHours = Math.min(8760, Math.max(100, vary(p.operatingHours)));
          scenarios.push(p);
        }

        try {
          const response = await fetch(API_BATCH, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scenarios })
          });
          const { results } = await response.json();
          results.forEach(model => npvs.push(model.metrics.project_npv));
        } catch (e) {
          console.error('Ошибка в чанке:', e);
        }
        progressSpan.innerText = `${Math.min(chunkEnd, iters)}/${iters}`;
      }

      progressSpan.innerText = 'Готово';
      if (npvs.length === 0) { document.getElementById('mcStats').innerHTML = 'Ошибка: нет результатов'; return; }

      const mean = npvs.reduce((a, b) => a + b, 0) / npvs.length;
      const sorted = npvs.slice().sort((a, b) => a - b);
      const p10 = sorted[Math.floor(sorted.length * 0.1)];
      const p90 = sorted[Math.floor(sorted.length * 0.9)];
      const probPos = npvs.filter(v => v > 0).length / npvs.length * 100;
      document.getElementById('mcStats').innerHTML = `Среднее NPV: ${fmt(mean)} | P10: ${fmt(p10)} | P90: ${fmt(p90)} | >0: ${probPos.toFixed(1)}%`;

      const bins = 20, min = sorted[0], max = sorted[sorted.length - 1];
      const step = (max - min) / bins;
      const hist = new Array(bins).fill(0);
      npvs.forEach(v => { const idx = Math.min(bins - 1, Math.floor((v - min) / step)); hist[idx]++; });
      if (charts.mcHist) charts.mcHist.destroy();
      charts.mcHist = new Chart(document.getElementById('mcHistogram'), {
        type: 'bar',
        data: { labels: Array.from({ length: bins }, (_, i) => (min + i * step).toFixed(0)), datasets: [{ data: hist, backgroundColor: '#00bfa6' }] }
      });
    });
    // Отчёт (генерируется на клиенте из currentModel)
    document.getElementById('generateReportBtn').addEventListener('click', async () => {

  <h2>5. Среднегодовые OPEX</h2>

    // Методология (модальное окно)
    const methodologyFullText = `

ПОЛНАЯ МЕТОДОЛОГИЯ РАСЧЁТА ЭНЕРГОЦЕНТРА · PROJECT FINANCE
(актуальная редакция, полностью соответствует серверной логике)

1. НАЗНАЧЕНИЕ И ОБЛАСТЬ ПРИМЕНЕНИЯ
Модель предназначена для оценки инвестиционной привлекательности газопоршневой электростанции (ГПЭС) с возможностью когенерации тепла. Поддерживаются:
- поэтапный ввод мощности (staged commissioning);
- одноставочный или мультирежимный (пик/полупик/ночь) тариф на электроэнергию;
- кредитное финансирование с выборкой долга пропорционально CAPEX;
- развёрнутая система налогообложения (прибыль, имущество, НДС, каникулы);
- дополнительные операционные затраты (масло, утилизация, расходники);
- анализ чувствительности (торнадо-диаграмма) и имитационное моделирование Монте-Карло.

В основе модели лежат классические принципы проектного финансирования: построение свободного денежного потока фирмы (FCFF) и потока на собственный капитал (FCFE), дисконтирование по WACC и Ke соответственно. Все цены номинированы в рублях, по умолчанию без НДС, если явно не включён соответствующий режим.

2. ГОРИЗОНТ ПЛАНИРОВАНИЯ И ВРЕМЕННАЯ СТРУКТУРА
Проект рассматривается на интервале Y лет (задаётся пользователем, от 5 до 20). Принята следующая периодизация:
- Год 0 – инвестиционная фаза: осуществляются предпроектные затраты (при staged commissioning) или полные капитальные вложения (при традиционном профиле).
- Годы 1…Y – эксплуатационная фаза: генерируются выручка, OPEX, налоги, обслуживается долг.

Все денежные потоки относятся к концу соответствующего года. Индексация инфляцией начинается с года 1 (для года 1 множитель = 1).

3. ТЕХНОЛОГИЧЕСКАЯ МОДЕЛЬ
3.1 Установленная мощность и поэтапный ввод
Пользователь выбирает режим ввода мощности:
- Поэтапный пуск (staged commissioning). Задаются:
    - предпроектные затраты (год 0) – lump sum;
    - список этапов: для каждого указывается год пуска (целое число от 1 до Y) и вводимая мощность P_i (МВт).
  Установленная мощность в году t:
    P_inst(t) = Σ_{i: year_i ≤ t} P_i.
  Если не задано ни одного этапа, но указана мощность слайдером, вся мощность вводится в год 1, а CAPEX относится на год 0.
- Традиционный ввод (одноэтапный). Мощность P_total задаётся слайдером. CAPEX распределяется по годам согласно профилю инвестиций:
    CAPEX_t = CAPEX_total * w_t,
  где w_t – нормализованные веса (сумма всех процентов профиля приводится к 100%). Если профиль не задан, 100% CAPEX относится на год 0. Вся мощность начинает эксплуатироваться с года 1.

3.2 Количество агрегатов
Для каждого эксплуатационного года t:
    N_units(t) = ceil(P_inst(t) / 0.5).
Принято, что один условный агрегат имеет электрическую мощность 0,5 МВт и тепловую мощность (для когенерации) 600 кВт.

3.3 Часы работы и доступность
Номинальный годовой фонд рабочего времени H_nom задаётся пользователем (по умолчанию 7800 ч). Если активирован коэффициент готовности (availability), эффективные часы:
    H_eff = H_nom * (Availability% / 100).
В противном случае H_eff = H_nom.

3.4 Режим генерации и выработка
Однозонный режим:
    GrossGen = P_inst * 1000 * H_eff * LoadFactor,
    OwnUse = GrossGen * (OwnNeeds% / 100),
    NetGen = GrossGen – OwnUse.
Параметр LoadFactor (коэффициент загрузки) задаётся одним числом.

Мультирежим (пик/полупик/ночь):
Пользователь вводит для трёх зон:
    s_i – доля времени (не обязательно в сумме 1, нормализуются),
    LF_i – коэффициент загрузки в зоне,
    T_i – тариф на электроэнергию (руб/кВт·ч).
Нормализованные доли: s'_i = s_i / Σ s_j.
Выработка по зонам:
    Gross_i = P_inst * 1000 * H_eff * s'_i * LF_i,
    OwnUse_i = Gross_i * (OwnNeeds% / 100),
    Net_i = Gross_i – OwnUse_i.
Общий полезный отпуск: NetGen = Σ Net_i.

3.5 Расход газа
Базовый удельный расход q0 (м³/кВт·ч) задаётся пользователем (по умолчанию 0,272).

Деградация:
    q_deg(t) = q0 * (1 + d/100)^{t-1},
где d – годовая деградация (%).

Коррекция при недогрузке (efficiency correction):
Если опция включена, определяется средняя загрузка:
- в однозонном режиме: avgLoad = LoadFactor;
- в мультирежиме: avgLoad = Σ (s'_i * LF_i).
Поправочный коэффициент add:
    add = 0, если avgLoad ≥ 1;
    add = Corr% / 100, если avgLoad < 0.5;
    add = (Corr% / 100) * (1 - avgLoad) / 0.5, если 0.5 ≤ avgLoad < 1.
Тогда скорректированный расход:
    q_corr = q_deg(t) * (1 + add).

Пусковой газ:
Если активирован, дополнительный объём:
    V_start = N_units * N_startups * V_per_startup,
где N_startups – количество пусков на один агрегат в год, V_per_startup – расход газа на один пуск (м³).
Годовой расход газа:
    V_gas(t) = GrossGen * q_corr + V_start.

4. КАПИТАЛЬНЫЕ ЗАТРАТЫ (CAPEX)
4.1 Удельный CAPEX
Суммируются компоненты (млн руб./МВт):
    capex_per_MW = capexEquipment + capexDesign + capexNetwork + capexCommissioning + capexInfrastructure.
При подключении на напряжении 0.4 кВ добавляется стоимость трансформатора 6 млн руб./МВт.
Если задан параметр capexPerMWTotal, он переопределяет сумму компонентов.

4.2 Распределение CAPEX
При поэтапном вводе CAPEX каждого этапа относится строго на год его пуска:
    CAPEX_stage = P_i * capex_per_MW * 10^6.
Предпроектные затраты (год 0) добавляются отдельно.

При традиционном вводе:
    CAPEX_total = P_total * capex_per_MW * 10^6.
По годам распределяется согласно нормализованному профилю. Сумма всех годовых CAPEX даёт totalCapexSum.

4.3 Амортизация
Амортизируемая база:
    DeprBase = totalCapexSum * (amortizablePercent / 100).
Срок полезного использования T_depr (лет) задаётся пользователем. Годовая норма амортизации:
    deprRate = 1 / T_depr.
При традиционном вводе вся база начинает амортизироваться с года 1.
При поэтапном вводе амортизация начисляется для каждого этапа начиная с года его пуска. Для года t амортизация:
    Depr(t) = Σ_{этапы с year_i ≤ t} (CAPEX_i * amortizablePercent/100) * deprRate.
Таким образом, в год пуска актива амортизация начисляется за полный год (допущение «полный год»).

4.4 Поддерживающий CAPEX
Ежегодные оттоки на поддержание основных средств:
    MaintCapexAnnual = totalCapexSum * (maintCapexPercent / 100).
Эта сумма вычитается из CFADS, FCFF и FCFE.

4.5 Капитальные ремонты (Lifecycle)
В серверной реализации не поддерживаются (параметры принимаются, но игнорируются). При необходимости они могут быть добавлены как дополнительные единовременные затраты в соответствующем году.

4.6 Ликвидационная стоимость
В последний год проекта (t = Y) добавляется ликвидационная стоимость:
    SalvageBeforeTax = totalCapexSum * (salvagePercent / 100).
Поскольку к концу срока активы полностью амортизированы (остаточная стоимость для налога на прибыль равна 0), вся ликвидационная выручка облагается налогом на прибыль (если он применяется):
    SalvageTax = SalvageBeforeTax * (ProfitTaxRate / 100),
    SalvageAfterTax = SalvageBeforeTax – SalvageTax.
Именно сумма после налога входит в CFADS и FCFF.

5. ОПЕРАЦИОННЫЕ ЗАТРАТЫ (OPEX)
Все элементы OPEX индексируются собственной инфляцией. Индекс для года t (t = 1..Y):
    Inf_factor(r, t) = (1 + r/100)^{t-1},
где r – годовая инфляция соответствующей статьи (%).

5.1 Топливо
    FuelCost(t) = V_gas(t) * FuelPrice(t),
    FuelPrice(t) = FuelPrice_base * Inf_factor(infl_gas, t).

5.2 Техническое обслуживание (по моточасам)
Для каждого интервала из таблицы (1000 ч, 4000 ч, 8000 ч, 16000 ч, 48000 ч) с заданной стоимостью за одно обслуживание на агрегат, накапливается наработка H_eff. Как только накопленный пробег достигает интервала, фиксируется обслуживание:
    cnt = floor(accumulated_hours / interval),
    MaintCost_interval = cnt * cost_per_service * N_units.
Накопленная наработка уменьшается на cnt * interval. Итоговая сумма умножается на инфляцию ТО:
    MaintCost(t) = Σ MaintCost_interval * Inf_factor(infl_maint, t).

5.3 Фонд оплаты труда
    FOT = 810 000 руб/мес * 12 = 9 720 000 руб/год (базовая ставка).
Индексируется: FOTCost(t) = FOT_base * Inf_factor(infl_fot, t).

5.4 Экологические платежи
    EcoCost(t) = (EcologyBase * EcologyFactor) * Inf_factor(infl_eco, t).

5.5 Прочие OPEX
Если включены: фиксированная годовая сумма OtherBase. Индексация:
- «Без индексации» – множитель = 1;
- «Общая инфляция» – Inf_factor(infl_general, t).
Дополнительно может быть включена плата за мощность:
    CapacityPayment = CapacityRate * P_inst * 1000 * 12 * Inf_factor(infl_general, t).

5.6 Масло
Параметры на один агрегат:
    OilRate – расход масла (л/1000 моточасов),
    OilPrice – цена масла (руб/л),
    OilChangeInterval – интервал замены (ч),
    OilChangeCost – стоимость замены (руб),
    OilTopUpCost – годовые расходы на долив (руб).
Расход масла: OilVolume = N_units * H_eff * OilRate / 1000 (л).
Затраты на масло: OilCost = OilVolume * OilPrice * Inf_factor(infl_general, t).
Число замен: OilChanges = floor(H_eff / OilChangeInterval).
Затраты на замены: OilChangeTotal = N_units * OilChanges * OilChangeCost * Inf_factor(infl_general, t).
Долив: OilTopUpTotal = N_units * OilTopUpCost * Inf_factor(infl_general, t).
Итого: TotalOilCost = OilCost + OilChangeTotal + OilTopUpTotal.

5.7 Утилизация отходов
Если активна: тип «фиксированная сумма» даёт WasteCost = WasteFixed * Inf_factor(infl_general, t);
тип «за моточас»: WasteCost = H_eff * WasteRate * Inf_factor(infl_general, t).

5.8 Расходники
Фиксированная сумма: ConsumablesCost = ConsumablesAnnual * Inf_factor(infl_general, t).

5.9 Суммарный OPEX (без НДС)
    OPEX(t) = FuelCost + MaintCost + FOTCost + EcoCost + OtherOpex + TotalOilCost + WasteCost + ConsumablesCost.

6. ВЫРУЧКА (БЕЗ НДС)
6.1 Электроэнергия
Тариф передачи зависит от класса напряжения:
    0.4 кВ – 0.329 руб/кВт·ч,
    10 кВ – 0.265 руб/кВт·ч.
Однозонный режим:
    RevenueGrid = NetGen * (GridPrice + TransferTariff) * Inf_factor(infl_grid, t).
Мультирежим: для каждой зоны i
    RevenueGrid_i = Net_i * (T_i + TransferTariff) * Inf_factor(infl_grid, t),
    RevenueGrid = Σ RevenueGrid_i.

6.2 Тепло (когенерация)
Тепловая мощность агрегата – 600 кВт. Коэффициент использования тепла – 0.65. Годовая выработка тепла:
    HeatMWh = N_units * 0.6 * H_eff * 0.65 / 1000 (МВт·ч).
Перевод в Гкал: 1 МВт·ч = 0.859845 Гкал.
    RevenueHeat = HeatMWh * 0.859845 * HeatTariff * Inf_factor(infl_heat, t).

6.3 Суммарная выручка
    TotalRevenue = RevenueGrid + RevenueHeat.

7. НАЛОГИ
7.1 Налог на прибыль
Ставка ProfitTaxRate (default 25%). Может действовать налоговые каникулы в первые TaxHolidayYears лет (налог = 0). Убытки переносятся вперёд без ограничения срока.

При расчёте налога для FCFE (levered) из EBIT вычитаются проценты по кредиту:
    EBIT_levered = EBITDA – Depreciation – PropertyTax – Interest.
При расчёте налога для FCFF (unlevered) проценты не вычитаются:
    EBIT_unlevered = EBITDA – Depreciation – PropertyTax.
В обоих случаях применяется перенос убытков: если EBIT < 0, убыток накапливается; при положительном EBIT сначала погашаются прошлые убытки, затем остаток облагается по ставке.

Налог (levered): ProfitTaxCorrected = max(0, EBIT_levered – использованные убытки) * TaxRate.
Налог (unlevered): UnleveredProfitTax = max(0, EBIT_unlevered – использованные убытки) * TaxRate.

7.2 Налог на имущество
Два режима:
- Кадастровый: PropertyTax = CadastralValue * CadastralRate.
- По остаточной стоимости (обычный): облагается остаточная стоимость амортизируемого имущества. При поэтапном вводе остаточная стоимость вычисляется индивидуально для каждого года ввода актива:
    Residual(t) = Σ_{stages with year_i ≤ t} max(0, AssetBase_i – AssetBase_i * deprRate * (t – year_i + 1)).
Для предпроектных затрат (год 0) считается, что они введены в год 1 (амортизация с года 1). PropertyTax = Residual(t) * PropertyTaxRate.

7.3 НДС
Если включён:
    VAT_out = TotalRevenue * VAT_rate.
    VAT_in_opex = OPEX * VAT_rate.
    VAT_in_capex = сумма НДС по капитальным затратам текущего года + возмещение НДС по предпроектным затратам (год 0) в первый год эксплуатации.
    VAT_net = VAT_out – VAT_in_opex – VAT_in_capex.
Отрицательный VAT_net трактуется как возврат налога (увеличивает денежный поток).

8. КРЕДИТНОЕ ФИНАНСИРОВАНИЕ
Параметры: доля заёмных средств DebtShare (%), ставка r_loan (% годовых), срок T_loan (лет), льготный период Grace (лет), тип платежа – аннуитет или дифференцированный.

Выборка долга происходит ежегодно пропорционально CAPEX:
    Draw(t) = totalCapexByYear[t] * DebtShare/100.
Сумма долга: TotalDebt = Σ Draw(t).

График погашения:
Проценты на остаток: Interest(t) = Remaining * r_loan.
В льготный период уплачиваются только проценты.
После льготного периода:
- Аннуитет: платёж A = TotalDebt * (r * (1+r)^n) / ((1+r)^n – 1), n = T_loan – Grace. Тело = A – Interest.
- Дифференцированный: тело = TotalDebt / n.

Платёж: Payment = Interest + Principal.

9. ДЕНЕЖНЫЕ ПОТОКИ
9.1 CFADS (денежный поток, доступный для обслуживания долга)
    CFADS(t) = EBITDA(t) – ProfitTaxCorrected(t) – PropertyTax(t) – MaintCapexAnnual
               + ΔWC(t) – VAT_net(t) + (SalvageAfterTax, если t = Y).
Оборотный капитал (если включён): в первый год отток в размере WC% от выручки, в последний год возврат.

9.2 FCFF (свободный денежный поток фирмы)
    FCFF(t) = EBITDA(t) – UnleveredProfitTax(t) – PropertyTax(t) – MaintCapexAnnual
              – GrowthCapex(t) + ΔWC(t) + (SalvageAfterTax, если t = Y).
Примечание: амортизация не добавляется, так как она уже учтена в налогооблагаемой базе (NOPAT + Depr – CapEx, но Depr не прибавляется отдельно, чтобы избежать двойного учёта).
GrowthCapex(t) – это инвестиции года t (totalCapexByYear[t+1], так как массив с года 0).

9.3 FCFE (свободный денежный поток на собственный капитал)
    FCFE(t) = CFADS(t) + Draw(t) – Payment(t) – EquityInvestment(t).
EquityInvestment(t) = totalCapexByYear[t] * (1 – DebtShare/100).

10. ФИНАНСОВЫЕ МЕТРИКИ
10.1 Стоимость капитала
    Ke = RiskFreeRate/100 + Beta * EquityRiskPremium/100.
    Kd_after_tax = r_loan * (1 – TaxRate) (если кредит есть).
    WACC = (EquityShare) * Ke + (DebtShare) * Kd_after_tax.

10.2 NPV и IRR
    NPV_project = -CAPEX_0 + Σ_{t=1}^{Y} FCFF(t) / (1+WACC)^t.
    IRR_project – корень NPV=0 (численно).
    NPV_equity = -Equity_0 + Σ_{t=1}^{Y} FCFE(t) / (1+Ke)^t.
    IRR_equity – аналогично.

10.3 DSCR и LLCR
    DSCR(t) = CFADS(t) / Payment(t) (если Payment > 0).
    LLCR = PV(CFADS, срок кредита, ставка LLCR) / TotalDebt.

10.4 ROE
    ROE = Среднегодовая чистая прибыль / TotalEquityInvestment.
Чистая прибыль = EBITDA – Depreciation – PropertyTax – Interest – ProfitTax.

11. ДОПУЩЕНИЯ И УПРОЩЕНИЯ
- Амортизация начисляется за полный год в году ввода актива (без полугодового допущения).
- Капитальные ремонты (lifecycle) в текущей версии не реализованы; соответствующие настройки игнорируются.
- При расчёте налога на имущество для предпроектных затрат (год 0) считается, что они начинают амортизироваться с года 1.
- В мультирежиме собственные нужды вычитаются из выработки каждой зоны до расчёта выручки.
- Перенос убытков по налогу на прибыль не ограничен по времени.

12. АНАЛИЗ ЧУВСТВИТЕЛЬНОСТИ И МОНТЕ-КАРЛО (реализованы на клиенте)
Анализ чувствительности: последовательно варьируются выбранные параметры на ±10/20%, для каждого варианта модель пересчитывается через API, строится торнадо-диаграмма и таблица.
Монте-Карло: случайно варьируются цена газа, тариф сети, компоненты CAPEX и часы работы (равномерное распределение в пределах заданного отклонения), накапливается распределение NPV проекта, вычисляются среднее, P10, P90, вероятность положительного NPV.

13. ЗАКЛЮЧЕНИЕ
Модель обеспечивает полный цикл оценки инвестиций в распределённую генерацию, позволяя анализировать как базовый сценарий, так и риски. Все формулы и допущения соответствуют современной практике проектного финансирования.

15. Примечания по реализации в коде
- Все расчёты выполняются в JavaScript с плавающей точкой.
- Инфляция применяется к базовому году 1: для t=1 множитель 1; для t=2 – (1+infl/100) и т.д.
- При профиле CAPEX проценты нормализуются к 100% автоматически, даже если сумма не равна 100.
- Количество агрегатов – округление вверх P_inst / 0.5.
- Убытки по налогу на прибыль переносятся без ограничения по годам.
- IRR вычисляется методом Ньютона (до 200 итераций).
- DSCR рассчитывается только для лет, когда есть платёж по долгу.
- При поэтапном пуске не используется профиль CAPEX и Lifecycle; все инвестиции привязаны к годам пуска этапов.
- График «Себестоимость vs тариф» использует суммарный OPEX за все годы и суммарный полезный отпуск – это средневзвешенная операционная себестоимость кВт·ч.`;
